<div class="chat-container">
    <div class="chat-box" id="chat-box">
        <p><strong>Chatbot:</strong> Hello! Ask me about stock trends.</p>
    </div>
    <input type="text" id="chat-input" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send</button>
</div>

<script>
function sendMessage() {
    let userMessage = document.getElementById("chat-input").value;
    let chatBox = document.getElementById("chat-box");

    chatBox.innerHTML += `<p><strong>You:</strong> ${userMessage}</p>`;

    fetch("/chatbot", {
        method: "POST",
        body: JSON.stringify({ message: userMessage }),
        headers: { "Content-Type": "application/json" }
    })
    .then(response => response.json())
    .then(data => {
        chatBox.innerHTML += `<p><strong>Chatbot:</strong> ${data.response}</p>`;
    });

    document.getElementById("chat-input").value = "";
}
</script>

<style>
.chat-container { position: fixed; bottom: 20px; right: 20px; width: 300px; background: #222; color: white; padding: 10px; border-radius: 5px; }
.chat-box { max-height: 200px; overflow-y: auto; margin-bottom: 10px; }
input { width: 70%; padding: 5px; }
button { width: 25%; padding: 5px; background: #28a745; color: white; border: none; cursor: pointer; }
</style>
